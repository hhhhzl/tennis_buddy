; Supervisor configuration for Gazebo container
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/root/.supervisor/supervisord.log
logfile_maxbytes=0
pidfile=/root/.supervisor/supervisord.pid
childlogdir=/root/.supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:vnc]
command=/bin/bash -lc /usr/local/bin/start-vnc.sh
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=DISPLAY=":1",HOME="/root",USER="root"

[program:novnc]
command=/usr/share/novnc/utils/launch.sh --vnc 127.0.0.1:5901 --listen 0.0.0.0:6080
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gazebo]
command=/bin/bash -lc "source /opt/ros/humble/setup.bash && [ -f /workspace/tennisbuddy/install/setup.bash ] && source /workspace/tennisbuddy/install/setup.bash && ros2 launch tennisbuddy_gazebo miti_65_gazebo.launch.py world:=court.sdf use_sim_time:=true"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=DISPLAY=":1",HOME="/root",USER="root",ROS_DOMAIN_ID="${ROS_DOMAIN_ID}",ROS_DISCOVERY_SERVER="${ROS_DISCOVERY_SERVER}"
